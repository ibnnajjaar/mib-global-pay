name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php-version }} Tests

    strategy:
      matrix:
        php-version: ['8.4', '8.5']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, json, curl
          coverage: xdebug

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Static analysis (1.x, level 1)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Static analysis (v2 core, level max)
        run: vendor/bin/phpstan analyse -c phpstan-core.neon.dist --no-progress

      - name: Static analysis (v2 Laravel layer, Larastan level max)
        run: vendor/bin/phpstan analyse -c phpstan-laravel.neon.dist --no-progress --memory-limit=1G

      - name: Run test suite
        run: |
          if [[ "${{ startsWith(github.event.head_commit.message, 'coverage') && matrix.php-version == '8.4' }}" == "true" ]]; then
            vendor/bin/pest --coverage-clover=clover.xml
          else
            vendor/bin/pest
          fi

      - name: Make code coverage badge
        if: startsWith(github.event.head_commit.message, 'coverage') && matrix.php-version == '8.4'
        uses: timkrase/phpunit-coverage-badge@v1.2.1
        with:
          coverage_badge_path: .github/coverage.svg
          push_badge: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          report: clover.xml
